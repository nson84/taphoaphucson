# Chạy local không cần MySQL: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:file:./data/taphoa;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
