services:
  mysql:
    image: mysql:8.4
    container_name: taphoa-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taphoa_debt
    ports:
      - "3306:3306"
    volumes:
      - taphoa_mysql_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  taphoa_mysql_dev:
