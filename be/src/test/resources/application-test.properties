# Chỉ cho integration test — H2 in-memory, không phải DB chạy app/shop
spring.datasource.url=jdbc:h2:mem:taphoa_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-init-sql=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.flyway.enabled=false

spring.web.cors.allowed-origins=http://localhost:5173

app.jwt.secret=taphoa-test-secret-key-must-be-32chars-min
app.jwt.expiration-ms=3600000
app.admin.username=admin
app.admin.password=admin123
app.admin.pin=123456

vtcpay.demo-mode=true
vtcpay.website-id=0
vtcpay.secret=ChangeMeSecret16Chars
vtcpay.receiver-account=
vtcpay.checkout-url=https://example.com/checkout
vtcpay.return-url=http://localhost:8080/api/payments/vtcpay/return
vtcpay.frontend-return-url=http://localhost:5173/cards/orders

app.card.encryption-key=taphoa-card-enc-key-change-me
