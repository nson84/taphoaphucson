spring.application.name=debt
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/tap_hoa?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.CharSet=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:taphoa-debt-secret-key-change-me-32chars-min}
app.jwt.expiration-ms=86400000
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.pin=${ADMIN_PIN:123456}
# Mật khẩu mở mục Backup trong Cài đặt
app.backup.password=${BACKUP_PASSWORD:842003}

spring.web.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# VTC Pay — demoMode=true: thanh toán giả lập local; tắt khi có website_id + secret thật
vtcpay.demo-mode=${VTCPAY_DEMO_MODE:true}
vtcpay.website-id=${VTCPAY_WEBSITE_ID:0}
vtcpay.secret=${VTCPAY_SECRET:ChangeMeSecret16Chars}
vtcpay.receiver-account=${VTCPAY_RECEIVER:}
vtcpay.checkout-url=${VTCPAY_CHECKOUT_URL:https://alpha1.vtcpay.vn/portalgateway/checkout.html}
vtcpay.return-url=${VTCPAY_RETURN_URL:http://localhost:8080/api/payments/vtcpay/return}
vtcpay.frontend-return-url=${VTCPAY_FE_RETURN:http://localhost:5173/cards/orders}

app.card.encryption-key=${CARD_ENC_KEY:taphoa-card-enc-key-change-me}
