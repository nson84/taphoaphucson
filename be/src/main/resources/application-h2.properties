# H2 file — chỉ khi chưa có MySQL. Không dùng cho desktop / dữ liệu shop.
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=h2"
spring.datasource.url=jdbc:h2:file:${TAPHOA_DATA_DIR:./data}/taphoa;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-init-sql=

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
